<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="See how a stock behaved through Fed rate cycles, and how sensitive it is to interest rates, inflation and unemployment." />
		<meta name="theme-color" content="#2b4acb" />
		<link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
		<title>Stock Analysis</title>
	</head>
	<body>
		<div id="root"></div>
		<script>
			// If this page is an outdated cached copy, its script may no longer exist.
			// Reload once to fetch the current version instead of showing a blank page.
			window.addEventListener(
				'error',
				function (e) {
					var t = e.target;
					if (t && t.tagName === 'SCRIPT' && t.type === 'module' && !sessionStorage.getItem('reloaded-for-update')) {
						sessionStorage.setItem('reloaded-for-update', '1');
						location.reload();
					}
				},
				true,
			);
			window.addEventListener('load', function () {
				setTimeout(function () {
					sessionStorage.removeItem('reloaded-for-update');
				}, 5000);
			});
		</script>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
